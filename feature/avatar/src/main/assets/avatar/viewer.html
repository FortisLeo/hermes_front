<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#05070A;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from './lib/three-vrm.module.min.js';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from './lib/three-vrm-animation.module.min.js';

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
renderer.setPixelRatio(1);  // this phone has 3.5 GB RAM; full-res WebGL gets the app killed under memory pressure
// The WebGL canvas is not composited reliably on this phone's WebView, so it stays off-screen and every frame is copied into a plain 2D canvas.
const view = document.createElement('canvas'); document.body.appendChild(view); const vctx = view.getContext('2d', { willReadFrequently: true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05070a);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 2, 2); scene.add(sun);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); view.width = w; view.height = h; view.style.cssText = `position:fixed;left:0;top:0;width:${w}px;height:${h}px`; camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); window.onerror = (m, s2, l) => console.log('JSERR', m, l);

let vrm = null, st = { mood: 'neutral', mouth: 0, gx: 0, gy: 0, action: 'idle', tilt: 0, nod: 0, arms: 0, slouch: 0, bounce: 0 };
const cur = { mouth: 0, tilt: 0, nod: 0, arms: 0, slouch: 0, gx: 0, gy: 0 };
let restHipsY = null, actStart = 0, lastAction = 'idle', blinkAt = 2, blinkT = -1;
let mixer = null, clipName = '', clipActive = false;
async function setClip(name) {
  clipName = name;
  if (mixer) { mixer.stopAllAction(); }
  clipActive = false;
  if (!name || !vrm) return;
  try {
    const loader = new GLTFLoader(); loader.register(p => new VRMAnimationLoaderPlugin(p));
    const g = await loader.loadAsync('https://appassets.androidplatform.net/model/clips/' + name + '.vrma');
    if (clipName !== name) return;
    const anim = g.userData.vrmAnimations && g.userData.vrmAnimations[0]; if (!anim) { console.log('CLIPERR no animation in', name); return; }
    mixer = new THREE.AnimationMixer(vrm.scene); mixer.clipAction(createVRMAnimationClip(anim, vrm)).play(); clipActive = true; console.log('CLIP playing', name);
  } catch (e) { console.log('CLIPERR', name, e); }
}
window.avatar = { apply(json) { try { const n = typeof json === 'string' ? JSON.parse(json) : json; if (n.action !== st.action) actStart = clock.getElapsedTime(); if ((n.clip || '') !== clipName) setClip(n.clip || ''); st = n; } catch (e) {} }, ready: false };
window.avatar.snap = () => { renderer.render(scene, camera); vctx.drawImage(renderer.domElement, 0, 0); return view.toDataURL('image/png'); };
const clock = new THREE.Clock();
const lerp = (a, b, k) => a + (b - a) * k;

new GLTFLoader().register(p => new VRMLoaderPlugin(p)).load('https://appassets.androidplatform.net/model/model.vrm', g => {
  vrm = g.userData.vrm; VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene);
  vrm.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(vrm.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const half = THREE.MathUtils.degToRad(15);
  const dist = (size.y / 2) / Math.tan(half) * 1.08;
  camera.position.set(c.x, c.y, c.z + dist); camera.lookAt(c);
  console.log('bbox', JSON.stringify(size), JSON.stringify(c), 'dist', dist, 'aspect', camera.aspect, 'canvas', innerWidth, innerHeight);
  window.avatar.ready = true; document.title = 'ready';
}, undefined, e => { document.title = 'error:' + e; });

const bone = n => vrm?.humanoid?.getNormalizedBoneNode(n);
function set(n, x, y, z) { const b = bone(n); if (b) b.rotation.set(x, y, z); }

// Frame limit (heat/battery): 30 fps while something moves, 10 fps when idle and nothing is being said.
let lastDraw = 0, hidden = false;
document.addEventListener('visibilitychange', () => { hidden = document.hidden; });
window.avatar.pause = v => { hidden = v; };
function frame(now) {
  requestAnimationFrame(frame);
  if (hidden) return;
  const busy = st.action !== 'idle' || st.mouth > 0.02 || st.bounce > 0.5;
  if (now - lastDraw < (busy ? 1000 / 30 : 1000 / 10) - 2) return;
  lastDraw = now;
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.getElapsedTime();
  if (!vrm) { renderer.render(scene, camera); vctx.drawImage(renderer.domElement, 0, 0); return; }
  const k = 1 - Math.pow(0.001, dt);
  for (const key of ['mouth','tilt','nod','arms','slouch']) cur[key] = lerp(cur[key], st[key] ?? 0, k);
  cur.gx = lerp(cur.gx, st.gx, k); cur.gy = lerp(cur.gy, st.gy, k);
  const a = clipActive ? 'idle' : st.action, e = t - actStart;
  const breathe = Math.sin(t * 1.6) * 0.012;
  let hipsY = 0, hipsRz = 0, spineX = 0.12 * cur.slouch, headX = cur.nod, headZ = cur.tilt, headY = -cur.gx * 0.5;
  headX += cur.gy * 0.25;
  // arms rest pose: hang down, slightly out; mood lifts them
  let lUA = 1.25 - cur.arms * 0.9, rUA = -1.25 + cur.arms * 0.9, lLA = 0, rLA = 0, lUAy = 0, rUAy = 0;
  if (a === 'wave') { rUA = 1.35; rLA = Math.sin(e * 9) * 0.5 + 0.5; headZ += 0.1; }
  if (a === 'cheer') { lUA = -1.4 - Math.sin(e * 8) * 0.15; rUA = 1.4 + Math.sin(e * 8) * 0.15; hipsY = Math.abs(Math.sin(e * 8)) * 0.04; }
  if (a === 'dance') {
    const b = e * 6; hipsRz = Math.sin(b) * 0.12; hipsY = Math.abs(Math.sin(b)) * 0.03; spineX += Math.sin(b * 2) * 0.05;
    lUA = -1.0 - Math.sin(b) * 0.9; rUA = 1.0 - Math.sin(b + Math.PI) * 0.9; lLA = Math.sin(b) * 0.4; rLA = -Math.sin(b) * 0.4; headZ += Math.sin(b) * 0.12;
    set('leftUpperLeg', 0, 0, Math.sin(b) * 0.08); set('rightUpperLeg', 0, 0, Math.sin(b) * 0.08);
  } else { set('leftUpperLeg', 0, 0, 0); set('rightUpperLeg', 0, 0, 0); }
  if (a === 'bow') { const p = Math.sin(Math.min(e / 1.2, 1) * Math.PI); spineX += p * 0.7; headX += p * 0.2; }
  if (a === 'nod') headX += Math.sin(e * 7) * 0.2 * Math.max(0, 1 - e / 2);
  if (st.bounce > 0 && a === 'idle') hipsY += Math.abs(Math.sin(t * 5)) * 0.008 * st.bounce;
  if (!clipActive) {
  set('leftUpperArm', 0, lUAy, lUA); set('rightUpperArm', 0, rUAy, rUA); set('leftLowerArm', 0, 0, lLA); set('rightLowerArm', 0, 0, rLA);
  set('spine', spineX + breathe, 0, 0); set('chest', breathe, 0, 0); set('neck', headX * 0.4, headY * 0.4, headZ * 0.4); set('head', headX * 0.6, headY * 0.6, headZ * 0.6);
  }
  if (mixer && clipActive) mixer.update(dt);
  const hips = !clipActive && bone('hips'); if (hips) { if (restHipsY === null) restHipsY = hips.position.y; hips.rotation.z = hipsRz; hips.position.y = restHipsY + hipsY; }
  const em = vrm.expressionManager;
  if (em) {
    em.setValue('aa', Math.min(1, cur.mouth)); 
    blinkAt -= dt; if (blinkAt <= 0 && blinkT < 0) blinkT = 0;
    if (blinkT >= 0) { blinkT += dt; em.setValue('blink', Math.sin(Math.min(blinkT / 0.18, 1) * Math.PI)); if (blinkT > 0.18) { blinkT = -1; blinkAt = 2 + Math.random() * 3; em.setValue('blink', 0); } }
  }
  vrm.update(dt); renderer.render(scene, camera); vctx.drawImage(renderer.domElement, 0, 0);
}
requestAnimationFrame(frame);
</script></body></html>
