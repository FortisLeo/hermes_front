<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#05070A;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from './lib/three-vrm.module.min.js';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from './lib/three-vrm-animation.module.min.js';

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
renderer.setPixelRatio(1);  // this phone has 3.5 GB RAM; full-res WebGL gets the app killed under memory pressure
// The WebGL canvas is not composited reliably on this phone's WebView, so it stays off-screen and every frame is copied into a plain 2D canvas.
const view = document.createElement('canvas'); document.body.appendChild(view); const vctx = view.getContext('2d', { willReadFrequently: true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05070a);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 2, 2); scene.add(sun);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); view.width = w; view.height = h; view.style.cssText = `position:fixed;left:0;top:0;width:${w}px;height:${h}px`; camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); window.onerror = (m, s2, l) => console.log('JSERR', m, l);

let vrm = null, st = { mouth: 0, gx: 0, gy: 0, clip: '', blend: 250, pose: { bones: {}, expr: {}, hips: null, pos: {} }, anim: null };
let animStart = 0, poseChangedAt = -1e9, blinkAt = 2, blinkT = -1, restHipsY = null;
const curBones = {}, curExpr = {}, curPos = {}; let curHips = [0, 0, 0], curMouth = 0, curGx = 0, curGy = 0;
// Only a neutral resting stance lives here (arms down). Every motion beyond that comes from the agent's pose/animation messages.
const REST = { leftUpperArm: [0, 0, 1.25], rightUpperArm: [0, 0, -1.25] };
let mixer = null, clipName = '', clipActive = false;
async function setClip(name) {
  clipName = name;
  if (mixer) { mixer.stopAllAction(); }
  clipActive = false;
  if (!name || !vrm) return;
  try {
    const loader = new GLTFLoader(); loader.register(p => new VRMAnimationLoaderPlugin(p));
    const g = await loader.loadAsync('https://appassets.androidplatform.net/model/clips/' + name + '.vrma');
    if (clipName !== name) return;
    const anim = g.userData.vrmAnimations && g.userData.vrmAnimations[0]; if (!anim) { console.log('CLIPERR no animation in', name); return; }
    mixer = new THREE.AnimationMixer(vrm.scene); mixer.clipAction(createVRMAnimationClip(anim, vrm)).play(); clipActive = true; console.log('CLIP playing', name);
  } catch (e) { console.log('CLIPERR', name, e); }
}
window.avatar = { apply(json) { try { const n = typeof json === 'string' ? JSON.parse(json) : json;
  if (JSON.stringify(n.anim) !== JSON.stringify(st.anim)) animStart = performance.now();
  if (JSON.stringify(n.pose) !== JSON.stringify(st.pose)) poseChangedAt = performance.now();
  if ((n.clip || '') !== clipName) setClip(n.clip || ''); st = n; } catch (e) {} }, ready: false };
window.avatar.snap = () => { renderer.render(scene, camera); vctx.drawImage(renderer.domElement, 0, 0); return view.toDataURL('image/png'); };
const clock = new THREE.Clock();
const lerp = (a, b, k) => a + (b - a) * k;

new GLTFLoader().register(p => new VRMLoaderPlugin(p)).load('https://appassets.androidplatform.net/model/model.vrm', g => {
  vrm = g.userData.vrm; VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene);
  vrm.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(vrm.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  modelTop = box.max.y;
  const half = THREE.MathUtils.degToRad(15);
  const dist = (size.y / 2) / Math.tan(half) * 1.08;
  camera.position.set(c.x, c.y, c.z + dist); camera.lookAt(c);
  console.log('bbox', JSON.stringify(size), JSON.stringify(c), 'dist', dist, 'aspect', camera.aspect, 'canvas', innerWidth, innerHeight);
  window.avatar.ready = true; document.title = 'ready';
}, undefined, e => { document.title = 'error:' + e; });

const raw = {};  // non-humanoid nodes: captured rest transform, agent values are offsets from it
function bone(n) { return vrm?.humanoid?.getNormalizedBoneNode(n) || null; }
function node(n) { return bone(n) || vrm?.scene?.getObjectByName(n) || null; }
function set(n, x, y, z) {
  const b = bone(n); if (b) { b.rotation.set(x, y, z); return; }
  const o = vrm?.scene?.getObjectByName(n); if (!o) return;
  const r = raw[n] || (raw[n] = { rot: o.rotation.clone(), pos: o.position.clone() });
  o.rotation.set(r.rot.x + x, r.rot.y + y, r.rot.z + z);
}
function setPos(n, x, y, z) {
  const o = node(n); if (!o) return;
  const r = raw[n] || (raw[n] = { rot: o.rotation.clone(), pos: o.position.clone() });
  o.position.set(r.pos.x + x, r.pos.y + y, r.pos.z + z);
}
// Names the agent may use: humanoid bones that exist plus every other named node.
window.avatar.listBones = () => {
  const names = new Set();
  const h = vrm.humanoid.humanBones ? Object.keys(vrm.humanoid.humanBones) : [];
  h.forEach(n => { if (vrm.humanoid.getNormalizedBoneNode(n)) names.add(n); });
  vrm.scene.traverse(o => { if (o.name && !/^(Scene|Armature|Root)$/i.test(o.name) && !/^Normalized_/.test(o.name)) names.add(o.name); });
  return JSON.stringify([...names]);
};

const MOODS = ['happy','sad','angry','surprised','relaxed','neutral'];
let headTick = 0, modelTop = 0;
const ease = x => x * x * (3 - 2 * x);
// Samples an agent animation at time t (ms): per bone/expression, ease between the keyframes that set it; before the first one it starts from rest.
function sample(anim, t) {
  const kfs = anim.keyframes, dur = kfs[kfs.length - 1].t;
  if (anim.loop && dur > 0) t = t % dur; else t = Math.min(t, dur);
  const bones = {}, expr = {}, pos = {}; let hips = null;
  const track = (get, restVal, out, key) => {
    let prev = { t: 0, v: restVal }, next = null;
    for (const k of kfs) { const v = get(k); if (v === undefined || v === null) continue; if (k.t <= t) prev = { t: k.t, v }; else { next = { t: k.t, v }; break; } }
    if (!next) return prev.v;
    const f = next.t === prev.t ? 1 : ease((t - prev.t) / (next.t - prev.t));
    return Array.isArray(next.v) ? next.v.map((x, i) => prev.v[i] + (x - prev.v[i]) * f) : prev.v + (next.v - prev.v) * f;
  };
  const boneNames = new Set(), exprNames = new Set(), posNames = new Set(); let anyHips = false;
  for (const k of kfs) { Object.keys(k.pose.pos || {}).forEach(n => posNames.add(n)); Object.keys(k.pose.bones).forEach(n => boneNames.add(n)); Object.keys(k.pose.expr).forEach(n => exprNames.add(n)); if (k.pose.hips) anyHips = true; }
  boneNames.forEach(n => { bones[n] = track(k => k.pose.bones[n], REST[n] || [0, 0, 0]); });
  posNames.forEach(n => { pos[n] = track(k => (k.pose.pos || {})[n], [0, 0, 0]); });
  exprNames.forEach(n => { expr[n] = track(k => k.pose.expr[n], 0); });
  if (anyHips) hips = track(k => k.pose.hips, [0, 0, 0]);
  return { bones, expr, hips, pos };
}

// Frame limit (heat/battery): 30 fps while something moves, 10 fps when idle and nothing is being said.
let lastDraw = 0, hidden = false;
document.addEventListener('visibilitychange', () => { hidden = document.hidden; });
window.avatar.pause = v => { hidden = v; };
function frame(now) {
  requestAnimationFrame(frame);
  if (hidden) return;
  const moving = !!st.anim || (now - poseChangedAt) < (st.blend + 200) || st.mouth > 0.02 || clipActive;
  if (now - lastDraw < (moving ? 1000 / 30 : 1000 / 10) - 2) return;
  lastDraw = now;
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.getElapsedTime();
  if (!vrm) { renderer.render(scene, camera); vctx.drawImage(renderer.domElement, 0, 0); return; }
  const k = 1 - Math.pow(0.001, dt), kb = st.blend <= 0 ? 1 : 1 - Math.exp(-dt / (st.blend / 1000 / 3));
  curMouth = lerp(curMouth, st.mouth, k); curGx = lerp(curGx, st.gx, k); curGy = lerp(curGy, st.gy, k);
  // Target = agent animation (if any) else the held pose, over the resting stance.
  let target = { bones: st.pose.bones, expr: st.pose.expr, hips: st.pose.hips, pos: st.pose.pos || {} }, direct = false;
  if (st.anim && st.anim.keyframes.length) { target = sample(st.anim, now - animStart); direct = true; }
  const names = new Set([...Object.keys(REST), ...Object.keys(curBones), ...Object.keys(target.bones)]);
  const breathe = Math.sin(t * 1.6) * 0.012;
  if (!clipActive) {
    names.forEach(n => {
      const want = target.bones[n] || REST[n] || [0, 0, 0];
      const c = curBones[n] || (curBones[n] = (REST[n] || [0, 0, 0]).slice());
      for (let i = 0; i < 3; i++) c[i] = direct ? want[i] : lerp(c[i], want[i], kb);
      let x = c[0], y = c[1], z = c[2];
      if (n === 'spine' || n === 'chest') x += breathe;
      if (n === 'head') { x += curGy * 0.15; y += -curGx * 0.3; }
      if (n === 'neck') { x += curGy * 0.1; y += -curGx * 0.2; }
      set(n, x, y, z);
    });
    for (const n of ['spine', 'chest', 'neck', 'head']) if (!names.has(n)) { const x = (n === 'spine' || n === 'chest' ? breathe : 0) + (n === 'head' ? curGy * 0.15 : n === 'neck' ? curGy * 0.1 : 0); const y = n === 'head' ? -curGx * 0.3 : n === 'neck' ? -curGx * 0.2 : 0; set(n, x, y, 0); }
    const pnames = new Set([...Object.keys(curPos), ...Object.keys(target.pos)]);
    pnames.forEach(n => { const w = target.pos[n] || [0, 0, 0]; const c = curPos[n] || (curPos[n] = [0, 0, 0]); for (let i = 0; i < 3; i++) c[i] = direct ? w[i] : lerp(c[i], w[i], kb); setPos(n, c[0], c[1], c[2]); });
    const hips = bone('hips');
    if (hips) {
      if (restHipsY === null) restHipsY = hips.position.y;
      const w = target.hips || [0, 0, 0]; curHips = curHips.map((v, i) => direct ? w[i] : lerp(v, w[i], kb));
      hips.position.set(curHips[0], restHipsY + curHips[1], curHips[2]);
    }
  } else if (mixer) mixer.update(dt);
  const em = vrm.expressionManager;
  if (em) {
    const exprNames = new Set([...Object.keys(curExpr), ...Object.keys(target.expr)]);
    exprNames.forEach(n => { const want = target.expr[n] ?? 0; curExpr[n] = direct ? want : lerp(curExpr[n] ?? 0, want, kb); em.setValue(n, curExpr[n]); });
    if (!('aa' in target.expr)) em.setValue('aa', Math.min(1, curMouth));
    if (!('blink' in target.expr)) {
      blinkAt -= dt; if (blinkAt <= 0 && blinkT < 0) blinkT = 0;
      if (blinkT >= 0) { blinkT += dt; em.setValue('blink', Math.sin(Math.min(blinkT / 0.18, 1) * Math.PI)); if (blinkT > 0.18) { blinkT = -1; blinkAt = 2 + Math.random() * 3; em.setValue('blink', 0); } }
    }
  }
  // Emotions: if the model defines an expression named like the face mood (happy, sad, angry, relaxed, surprised ...), drive it from the mood.
  if (em && st.mood) { for (const m of MOODS) { if (em.getExpression && em.getExpression(m)) em.setValue(m, m === st.mood ? 0.8 : 0); } }
  vrm.update(dt); renderer.render(scene, camera); vctx.drawImage(renderer.domElement, 0, 0);
  // Tell the app where the head is on screen so it can draw emotion effects (blush, tears, hearts) over it.
  if ((++headTick % 6) === 0 && window.Native && Native.onHead) {
    // Face centre ~45% of the way from the head bone to the top of the model; head height = that distance.
    const h = bone('head'); if (h) { const p = h.getWorldPosition(new THREE.Vector3()), topY = Math.max(modelTop, p.y + 0.15);
      const face = new THREE.Vector3(p.x, p.y + 0.45 * (topY - p.y), p.z), top = new THREE.Vector3(p.x, topY, p.z);
      const a = face.project(camera), b = top.project(camera), c0 = p.clone().project(camera);
      Native.onHead((a.x + 1) / 2, (1 - a.y) / 2, Math.abs(b.y - c0.y) / 2); }
  }
}

requestAnimationFrame(frame);
</script></body></html>
